aid: arrcus
name: Arrcus
description: 'Arrcus is an AI-native networking software company that builds policy-driven
  routing, switching, and AI fabric spanning the edge, datacenter, and cloud. Its flagship
  ArcOS network operating system runs on merchant-silicon hardware and is complemented by
  ArcRR (scale-out route reflector), ArcIQ (analytics and visibility), ACE / ACE-AI (the
  Arrcus Connected Edge control and AI-networking platform), AINF (Arrcus Inference Network
  Fabric), and the TGAX AI switch. Arrcus targets GPU cluster connectivity for AI training
  and low-latency inferencing networks that reduce token cost. The company is venture backed
  by General Catalyst and Lightspeed Venture Partners. It exposes a login-gated customer
  portal and academy rather than a public developer API; no public OpenAPI, SDKs, or hosted
  API surface were found during enrichment.'
